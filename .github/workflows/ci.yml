name: CI

# Everything a publish depends on, run on every change. A release should never be the
# first time codegen runs against a new contract or toolchain version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      # `build` runs protoc and compiles the result, which is the whole contract of this
      # repo: if generated code does not compile, the published JAR is broken.
      - name: Generate and compile
        run: ./gradlew build

      # Catches a missing POM field or an unbuildable sources/javadoc jar here rather than
      # on the Central upload, where the failure costs a burnt version number.
      - name: Verify the publishable artifacts assemble
        run: ./gradlew publishToMavenLocal

      - name: Report generated file counts
        run: |
          set -euo pipefail
          out=build/generated/sources/proto/main
          total=$(find "$out" -type f | wc -l | tr -d ' ')
          echo "### Kotlin codegen: $total files" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '| generator | files |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for d in "$out"/*/; do
            echo "| $(basename "$d") | $(find "$d" -type f | wc -l | tr -d ' ') |" >> "$GITHUB_STEP_SUMMARY"
          done

  swift:
    name: Swift package
    # swift-protobuf and grpc-swift-2 both need the Apple toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: swift build

      - name: Install the Swift protoc plugins
        run: brew install protobuf swift-protobuf protoc-gen-grpc-swift

      # Sources/ is committed because SPM ships plain source. That makes it possible for
      # someone to change a .proto and forget to regenerate, so re-run codegen and fail if
      # the tree moves.
      - name: Check the committed Swift is up to date
        run: |
          set -euo pipefail
          scripts/generate-swift.sh
          if git diff --quiet -- Sources; then
            echo "Sources/ matches the protos."
            exit 0
          fi
          # Two different causes land here and the fix differs. Print the toolchain so the
          # version-skew case is obvious rather than looking like a stale commit.
          echo "::error::Sources/ does not match what codegen produces."
          echo "Either the protos changed without regenerating, or these generators differ"
          echo "from the ones that produced the committed output:"
          protoc --version
          echo "protoc-gen-swift $(protoc-gen-swift --version 2>&1 | tail -1)"
          brew list --versions protoc-gen-grpc-swift
          git --no-pager diff --stat -- Sources
          exit 1
