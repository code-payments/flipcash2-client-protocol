name: CI

# Everything a publish depends on, run on every change. A release should never be the
# first time codegen runs against a new contract or toolchain version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `scripts/sync-protos.sh --local` writes `commit: LOCAL` so the contract can be
      # iterated on without pushing it. proto/ then reflects somebody's working tree, which
      # no other checkout can reproduce, so it must not reach main.
      - name: Reject a local contract sync
        run: |
          set -euo pipefail
          if grep -q '^commit: LOCAL' flipcash2.lock; then
            echo "::error::flipcash2.lock records a local sync. Push the contract change to flipcash2-protobuf-api, then re-run scripts/sync-protos.sh <sha>."
            cat flipcash2.lock
            exit 1
          fi
          echo "Pinned at $(awk '/^commit:/ {print $2}' flipcash2.lock)."

  kotlin:
    name: Kotlin codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      # `build` runs protoc and compiles the result, which is the whole contract of this
      # repo: if generated code does not compile, the published JAR is broken.
      - name: Generate and compile
        run: ./gradlew build

      # Catches a missing POM field or an unbuildable sources/javadoc jar here rather than
      # on the Central upload, where the failure costs a burnt version number.
      - name: Verify the publishable artifacts assemble
        run: ./gradlew publishToMavenLocal

      - name: Report generated file counts
        run: |
          set -euo pipefail
          out=build/generated/sources/proto/main
          total=$(find "$out" -type f | wc -l | tr -d ' ')
          echo "### Kotlin codegen: $total files" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '| generator | files |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for d in "$out"/*/; do
            echo "| $(basename "$d") | $(find "$d" -type f | wc -l | tr -d ' ') |" >> "$GITHUB_STEP_SUMMARY"
          done

  swift:
    name: Swift package
    # swift-protobuf and grpc-swift-2 both need the Apple toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: swift build

      # Pinned, not brew: the generators are what decide the bytes in Sources/, and the
      # gRPC stub text tracks the transitive grpc-swift-2 version as well as the plugin's.
      # The cache key is the pin file, so a bump rebuilds and nothing else does.
      - name: Cache the pinned codegen toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: swift-codegen-${{ runner.os }}-${{ hashFiles('scripts/toolchain.env') }}

      - name: Install the pinned codegen toolchain
        run: scripts/install-swift-toolchain.sh

      # Sources/ is committed because SPM ships plain source. That makes it possible for
      # someone to change a .proto and forget to regenerate, so re-run codegen and fail if
      # the tree moves.
      - name: Check the committed Swift is up to date
        run: |
          set -euo pipefail
          scripts/generate-swift.sh
          if git diff --quiet -- Sources; then
            echo "Sources/ matches the protos."
            exit 0
          fi
          # The generators are pinned, so the honest reading is "a .proto changed and
          # Sources/ did not". Print the pins anyway: a stale cache or a hand-edited
          # toolchain.env produces the same diff and wants a different fix.
          echo "::error::Sources/ does not match what codegen produces."
          echo "Run scripts/generate-swift.sh and commit the result. Pinned toolchain:"
          cat scripts/toolchain.env | grep -v '^#'
          git --no-pager diff --stat -- Sources
          exit 1
